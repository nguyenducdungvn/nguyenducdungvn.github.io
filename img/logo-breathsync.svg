<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BreathSync – logo: vòng hơi thở lan toả + quả cầu với làn sóng hít vào/thở ra; chấm vàng = trái tim (đồng bộ với logo HLV Sức Khỏe) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13284d"/>
      <stop offset="1" stop-color="#070d1a"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#9ff5d4"/>
      <stop offset=".55" stop-color="#19c08a"/>
      <stop offset="1" stop-color="#0b6b55"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#19c08a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#19c08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#9ff5d4" stroke-opacity=".14" stroke-width="6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#9ff5d4" stroke-opacity=".28" stroke-width="7"/>
  <circle cx="256" cy="256" r="122" fill="url(#orb)"/>
  <!-- làn sóng: nửa trên hít vào, nửa dưới thở ra -->
  <path d="M138 262 C 178 192, 218 192, 256 256 S 334 320, 374 250" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <circle cx="197" cy="209" r="17" fill="url(#gold)"/>
</svg>
